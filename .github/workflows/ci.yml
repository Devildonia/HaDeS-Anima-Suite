name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend JavaScript syntax
        run: |
          for f in web/*.js; do
            node --check "$f"
          done

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy safetensors scipy

      - name: Run test suite
        run: python tests/test_hades_suite.py
        working-directory: .

      - name: Show result
        if: always()
        run: echo "=== HaDeS Anima Suite CI ==="

  smoke:
    # Real ComfyUI (latest), this pack only, CPU: node registration + a graph through the real execution engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ComfyUI
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI

      - name: Checkout this pack into custom_nodes
        uses: actions/checkout@v4
        with:
          path: ComfyUI/custom_nodes/Comfyui-HaDeS-Anima-BlockMerger

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ComfyUI
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - name: Smoke test
        run: python ComfyUI/custom_nodes/Comfyui-HaDeS-Anima-BlockMerger/tests/smoke_test.py --comfy-dir ComfyUI --cpu

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Frontend test (classic canvas + Nodes 2.0)
        run: python ComfyUI/custom_nodes/Comfyui-HaDeS-Anima-BlockMerger/tests/frontend_test.py --comfy-dir ComfyUI --cpu
