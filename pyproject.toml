[project]
name = "hades-anima-suite"
description = "25 ComfyUI nodes for the Anima model family: loaders, block / multi-model (TIES, DARE, Model Stock, SLERP) / CLIP / LoRA mergers, LoRA extractor, resizer and block weight, a model saver (bf16, fp8, ConvRot INT8 / INT4, Diffusers), prompt helpers with a local artist / character catalog, NAG, single / dual / triple-pass samplers, corner-mark removal and a telemetry node."
version = "0.4.6"
authors = [
    { name = "Devildonia" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: ComfyUI",
]
keywords = [
    "comfyui",
    "anima",
    "model-merging",
    "lora",
    "flow-matching",
    "nag",
    "ksampler",
    "qwen",
    "diffusers"
]
dependencies = [
    "safetensors",
    "scipy",
]

[project.urls]
Repository = "https://github.com/Devildonia/HaDeS-Anima-Suite"
"Bug Tracker" = "https://github.com/Devildonia/HaDeS-Anima-Suite/issues"

[tool.comfy]
PublisherId = "hades"
DisplayName = "HaDeS Anima Suite"
Icon = "https://raw.githubusercontent.com/Devildonia/HaDeS-Anima-Suite/main/web/icon.png"
includes = [
    "web",
    "examples",
]
